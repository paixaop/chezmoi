# Managed by chezmoi — TPM plugins replace nixpkgs tmuxPlugins

set -g prefix C-x
unbind C-b
bind C-x send-prefix

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -g extended-keys on
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g escape-time 100
set -g mode-keys emacs
set -g repeat-time 800
set-option -g renumber-windows on
set -g display-panes-time 3000

setw -g monitor-activity on
set -g visual-activity off

set -g pane-border-status top
set -g pane-border-format " #P: #{?pane_title,#{pane_title},#{pane_current_command}} [#{pane_current_path}] "

# Status bar (Tokyo Night)
set -g status-position bottom
set -g status-interval 5
set -g status-justify centre
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#1a1b26,fg=#7aa2f7"
set -g status-left-length 40
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#1a1b26]#{?window_zoomed_flag, #[fg=#e0af68]ZOOMED ,}"
setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[fg=#1a1b26,bg=#7aa2f7,bold] #I:#W "
setw -g window-status-activity-style "fg=#e0af68,bold"
set -g status-right-length 40
set -g status-right "#[fg=#565f89] %a %b %d #[fg=#a9b1d6,bold] %H:%M "

# Window jumps
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

bind -n M-n new-window -c "#{pane_current_path}"
bind -n M-h split-window -h -c "#{pane_current_path}"
bind -n M-v split-window -v -c "#{pane_current_path}"
bind -n M-1 select-pane -t 1
bind -n M-2 select-pane -t 2
bind -n M-3 select-pane -t 3
bind -n M-4 select-pane -t 4
bind -n M-5 select-pane -t 5
bind -n M-6 select-pane -t 6
bind -n M-7 select-pane -t 7
bind -n M-8 select-pane -t 8
bind -n M-9 select-pane -t 9

bind -r M-Up    resize-pane -U 2
bind -r M-Down  resize-pane -D 2
bind -r M-Left  resize-pane -L 2
bind -r M-Right resize-pane -R 2
bind -r S-Up    resize-pane -U 10
bind -r S-Down  resize-pane -D 10
bind -r S-Left  resize-pane -L 10
bind -r S-Right resize-pane -R 10

bind S display-panes \; command-prompt -p "swap with pane:" "swap-pane -t '%%'"
bind f display-popup -E -w 60% -h 60% "tmux list-sessions -F '#{session_name}' | fzf --reverse --header='Switch session' | xargs tmux switch-client -t"
bind F display-popup -E -w 60% -h 60% "tmux list-windows -a -F '#{session_name}:#{window_index} #{window_name}' | fzf --reverse --header='Switch window' | cut -d' ' -f1 | xargs tmux switch-client -t"
bind D new-window -n dev -c "#{pane_current_path}" \; \
  split-window -h -p 35 -c "#{pane_current_path}" \; \
  split-window -v -p 50 -c "#{pane_current_path}" \; \
  select-pane -t 1
bind . command-prompt -p "Pane name:" "select-pane -T '%%'"
bind Q confirm-before -p "Kill session #S? (y/n)" kill-session
bind W command-prompt -p "Save layout as:" "run-shell '~/.local/bin/tmux-save-layout %%'"
bind L display-popup -E -w 60% -h 60% "~/.local/bin/tmux-load-layout"

unbind h
unbind v
bind h split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @continuum-restore 'on'
set -g @yank_selection_mouse 'clipboard'
set -g @yank_action 'copy-pipe-and-cancel'
set -g @override_copy_command 'pbcopy'
set -g @pain-control-bindings 'off'

run '~/.tmux/plugins/tpm/tpm'
